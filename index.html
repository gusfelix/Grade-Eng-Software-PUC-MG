<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Inteligente - Engenharia de Software (PUC Minas)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;

            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #4f46e5 100%);

            /* Status Colors (Light Palette) */
            --status-concluida-bg: #f0fdf4;
            --status-concluida-border: #10b981;
            --status-concluida-text: #065f46;

            --status-cursando-bg: #eff6ff;
            --status-cursando-border: #3b82f6;
            --status-cursando-text: #1e40af;

            --status-disponivel-bg: #fffbeb;
            --status-disponivel-border: #f59e0b;
            --status-disponivel-text: #92400e;

            --status-bloqueada-bg: #f8fafc;
            --status-bloqueada-border: #cbd5e1;
            --status-bloqueada-text: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%) fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .stats-bar>div {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            color: var(--text-muted);
        }

        .stats-bar span.highlight {
            color: #10b981;
            font-size: 1.05rem;
            font-weight: 700;
        }

        button.limpar {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            padding: 8px 18px;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        button.limpar:hover {
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .grade-container {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 24px;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: stretch;
            scroll-behavior: smooth;
        }

        .grade-container::-webkit-scrollbar {
            height: 10px;
        }

        .grade-container::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 5px;
        }

        .grade-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 5px;
            border: 2px solid #f8fafc;
        }

        .grade-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .periodo {
            min-width: 320px;
            max-width: 320px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .periodo:hover {
            box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.08);
        }

        .periodo-header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .btn-concluir-periodo {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            padding: 0;
            margin: 0;
        }

        .btn-concluir-periodo:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .disciplinas-lista {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .disciplinas-lista::-webkit-scrollbar {
            width: 6px;
        }

        .disciplinas-lista::-webkit-scrollbar-track {
            background: transparent;
        }

        .disciplinas-lista::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .disciplinas-lista::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .disciplina {
            border: 1px solid transparent;
            border-left-width: 4px;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
            cursor: grab;
        }

        .disciplina:active {
            cursor: grabbing;
        }

        .disciplina.dragging {
            opacity: 0.5;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.1);
        }

        .disciplina:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.08);
        }

        .info-superior {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            font-weight: 600;
            font-size: 0.88rem;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .ch-info {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            margin-left: 8px;
        }

        .selecao-status {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 0.83rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .selecao-status:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .selecao-status:disabled {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            cursor: not-allowed;
            color: #94a3b8;
        }

        .nota,
        .falta {
            font-size: 0.78rem;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #e2e8f0;
            line-height: 1.4;
        }

        .falta {
            color: #dc2626;
            font-weight: 600;
        }

        .nota {
            color: #64748b;
            font-style: italic;
        }

        /* STATUS TEMAS (Light Mode Palette) */
        .status-concluida {
            background-color: var(--status-concluida-bg);
            border-color: #a7f3d0;
            border-left-color: var(--status-concluida-border);
            color: var(--status-concluida-text);
        }

        .status-concluida .ch-info {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #a7f3d0;
        }

        .status-cursando {
            background-color: var(--status-cursando-bg);
            border-color: #bfdbfe;
            border-left-color: var(--status-cursando-border);
            color: var(--status-cursando-text);
        }

        .status-cursando .ch-info {
            background: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #93c5fd;
        }

        .status-disponivel {
            background-color: var(--status-disponivel-bg);
            border-color: #fde68a;
            border-left-color: var(--status-disponivel-border);
            color: var(--status-disponivel-text);
        }

        .status-disponivel .ch-info {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fde047;
        }

        .status-bloqueada {
            background-color: var(--status-bloqueada-bg);
            border-color: #e2e8f0;
            border-left-color: var(--status-bloqueada-border);
            color: var(--status-bloqueada-text);
        }

        .status-bloqueada .ch-info {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎓 Grade Inteligente - Eng. de Software (PUC Minas)</h1>
        <div class="stats-bar">
            <div>Concluídas: <span class="highlight" id="contador">0</span>/<span id="total">0</span></div>
            <div>Cursando: <span class="highlight" style="color: #2563eb" id="cursando">0</span></div>
            <div>Carga Horária (Concluída): <span class="highlight" style="color: #4f46e5" id="horas">0</span>h</div>
            <button class="limpar" onclick="limparGrade()">Limpar Grade</button>
        </div>
    </header>

    <div class="grade-container" id="grade-container">
        <!-- Renderizado pelo JavaScript -->
    </div>

    <script src="disciplinas.js"></script>

    <script>
        // Agora armazenamos o estado como um objeto: { "Nome da Matéria": "concluida" | "cursando" }
        let statusMaterias = JSON.parse(localStorage.getItem('pucEngSoftStatus')) || {};
        let ordemMaterias = JSON.parse(localStorage.getItem('pucEngSoftOrdem')) || {};

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.disciplina:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function salvarNovaOrdem(periodo, lista) {
            const cards = [...lista.querySelectorAll('.disciplina')];
            const novaOrdem = cards.map(card => card.dataset.nome);
            ordemMaterias[periodo] = novaOrdem;
            localStorage.setItem('pucEngSoftOrdem', JSON.stringify(ordemMaterias));
        }

        function salvarProgresso() {
            validarECorrigirGrade();
            localStorage.setItem('pucEngSoftStatus', JSON.stringify(statusMaterias));
            renderizarGrade();
        }

        function validarECorrigirGrade() {
            let mudou = false;

            // Calcula CH atual concluída
            let totalHoras = 0;
            for (const [nome, status] of Object.entries(statusMaterias)) {
                if (status === 'concluida' && disciplinas[nome]) {
                    totalHoras += disciplinas[nome].ch;
                }
            }

            for (const [nome, status] of Object.entries(statusMaterias)) {
                const info = disciplinas[nome];
                if (!info) continue;

                const prereqsOk = info.prereqs.every(req => statusMaterias[req] === 'concluida');
                const horasOk = !info.req_ch || (totalHoras >= info.req_ch);
                const correqsOk = !info.correqs || info.correqs.every(req => statusMaterias[req] === 'cursando' || statusMaterias[req] === 'concluida');

                if (status === 'cursando' && (!prereqsOk || !horasOk || !correqsOk)) {
                    delete statusMaterias[nome];
                    mudou = true;
                } else if (status === 'concluida' && (!prereqsOk || !horasOk || !correqsOk)) {
                    delete statusMaterias[nome];
                    mudou = true;
                }
            }

            if (mudou) {
                validarECorrigirGrade();
            }
        }

        function atualizarStatus(nome, novoStatus) {
            if (novoStatus === 'cursando' || novoStatus === 'concluida') {
                const info = disciplinas[nome];
                if (info && info.correqs && info.correqs.length > 0) {
                    const faltamCorreqs = info.correqs.filter(req =>
                        statusMaterias[req] !== 'cursando' && statusMaterias[req] !== 'concluida'
                    );
                    if (faltamCorreqs.length > 0) {
                        alert(`Para marcar "${nome}" como ${novoStatus === 'cursando' ? 'Cursando' : 'Concluída'}, a(s) matéria(s) correquisito(s) (${faltamCorreqs.join(', ')}) precisa(m) estar como "Cursando" ou "Concluída".`);
                        renderizarGrade();
                        return;
                    }
                }
            }

            if (novoStatus === 'pendente') {
                delete statusMaterias[nome];
            } else {
                statusMaterias[nome] = novoStatus;
            }
            salvarProgresso();
        }

        function limparGrade() {
            if (confirm("Tem certeza que deseja limpar todo o seu progresso?")) {
                statusMaterias = {};
                ordemMaterias = {};
                localStorage.removeItem('pucEngSoftOrdem');
                salvarProgresso();
            }
        }

        function concluirPeriodo(periodo) {
            if (!confirm(`Tem certeza que deseja marcar todo o ${periodo}º Período como concluído?`)) {
                return;
            }
            const materiasPeriodo = Object.entries(disciplinas).filter(([_, info]) => info.periodo === periodo);
            let mudou = false;

            materiasPeriodo.forEach(([nome, info]) => {
                if (statusMaterias[nome] !== 'concluida') {
                    statusMaterias[nome] = 'concluida';
                    mudou = true;
                }
            });

            if (mudou) {
                salvarProgresso();
                const concluidasAgora = materiasPeriodo.every(([nome, info]) => statusMaterias[nome] === 'concluida');
                if (!concluidasAgora) {
                    alert("Algumas matérias não puderam ser concluídas pois possuem pré-requisitos pendentes ou exigem mais carga horária.");
                }
            }
        }

        function renderizarGrade() {
            const listasAtuais = document.querySelectorAll('.disciplinas-lista');
            const scrolls = Array.from(listasAtuais).map(lista => lista.scrollTop);

            const container = document.getElementById('grade-container');
            container.innerHTML = '';

            let totalHoras = 0;
            let concluidasCount = 0;
            let cursandoCount = 0;

            // Calcula estatísticas
            for (const [nome, status] of Object.entries(statusMaterias)) {
                if (status === 'concluida') {
                    concluidasCount++;
                    if (disciplinas[nome] && disciplinas[nome].ch) {
                        totalHoras += disciplinas[nome].ch;
                    }
                } else if (status === 'cursando') {
                    cursandoCount++;
                }
            }

            document.getElementById('total').innerText = Object.keys(disciplinas).length;
            document.getElementById('contador').innerText = concluidasCount;
            document.getElementById('cursando').innerText = cursandoCount;
            document.getElementById('horas').innerText = totalHoras;

            let maxPeriodo = 8; // A grade da PUC tem 8 períodos

            for (let i = 1; i <= maxPeriodo; i++) {
                const col = document.createElement('div');
                col.className = 'periodo';

                const header = document.createElement('div');
                header.className = 'periodo-header';

                const titulo = document.createElement('span');
                titulo.innerText = `${i}º Período`;

                const btnConcluir = document.createElement('button');
                btnConcluir.className = 'btn-concluir-periodo';
                btnConcluir.innerHTML = '✓';
                btnConcluir.title = 'Concluir Período';
                btnConcluir.onclick = () => concluirPeriodo(i);

                header.appendChild(titulo);
                header.appendChild(btnConcluir);

                col.appendChild(header);

                const lista = document.createElement('div');
                lista.className = 'disciplinas-lista';

                lista.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const draggingCard = document.querySelector('.dragging');
                    if (!draggingCard || draggingCard.dataset.periodo != i) return;

                    const afterElement = getDragAfterElement(lista, e.clientY);
                    if (afterElement == null) {
                        lista.appendChild(draggingCard);
                    } else {
                        lista.insertBefore(draggingCard, afterElement);
                    }
                });

                lista.addEventListener('drop', (e) => {
                    e.preventDefault();
                    salvarNovaOrdem(i, lista);
                });

                const materiasPeriodo = Object.entries(disciplinas).filter(([_, info]) => info.periodo === i);

                materiasPeriodo.sort((a, b) => {
                    const orderA = (ordemMaterias[i] || []).indexOf(a[0]);
                    const orderB = (ordemMaterias[i] || []).indexOf(b[0]);

                    if (orderA !== -1 && orderB !== -1) return orderA - orderB;
                    if (orderA !== -1) return -1;
                    if (orderB !== -1) return 1;
                    return 0;
                });

                materiasPeriodo.forEach(([nome, info]) => {
                    const statusAtual = statusMaterias[nome] || 'pendente';

                    // Condição para pré-requisitos e Carga Horária
                    const prereqsOk = info.prereqs.every(req => statusMaterias[req] === 'concluida');
                    const horasOk = !info.req_ch || (totalHoras >= info.req_ch);

                    // Condição para correquisitos: precisam estar 'cursando' ou 'concluida'
                    const faltamCorreqs = (info.correqs || []).filter(req =>
                        statusMaterias[req] !== 'cursando' && statusMaterias[req] !== 'concluida'
                    );
                    const correqsOk = faltamCorreqs.length === 0;

                    const isAvailable = prereqsOk && horasOk;

                    // Define a classe CSS baseada no status atual e na disponibilidade
                    let classeCartao = 'status-bloqueada';
                    let icone = '🔒';

                    if (statusAtual === 'concluida') {
                        classeCartao = 'status-concluida';
                        icone = '✅';
                    } else if (statusAtual === 'cursando') {
                        classeCartao = 'status-cursando';
                        icone = '📘';
                    } else if (isAvailable && correqsOk) {
                        classeCartao = 'status-disponivel';
                        icone = '⏳';
                    }

                    const card = document.createElement('div');
                    card.className = `disciplina ${classeCartao}`;
                    card.draggable = true;
                    card.dataset.nome = nome;
                    card.dataset.periodo = i;

                    card.addEventListener('dragstart', (e) => {
                        card.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', nome);
                        e.dataTransfer.effectAllowed = 'move';
                    });

                    card.addEventListener('dragend', () => {
                        card.classList.remove('dragging');
                    });

                    // Clicar no card para alternar status
                    card.addEventListener('click', (e) => {
                        // Evita acionar ao clicar no select ou se o card estiver bloqueado
                        if (e.target.tagName.toLowerCase() === 'select') return;
                        if (!isAvailable && statusAtual === 'pendente') return;

                        let nextStatus = 'pendente';
                        if (statusAtual === 'pendente') nextStatus = 'cursando';
                        else if (statusAtual === 'cursando') nextStatus = 'concluida';
                        else if (statusAtual === 'concluida') nextStatus = 'pendente';

                        atualizarStatus(nome, nextStatus);
                    });

                    // Bloqueia a edição se não estiver disponível e não possuir um status ativo
                    const isDisabled = !isAvailable && statusAtual === 'pendente' ? 'disabled' : '';

                    let html = `
                        <div class="info-superior">
                            <span>${icone} ${nome}</span>
                            <span class="ch-info">${info.ch}h</span>
                        </div>
                        <select class="selecao-status" onchange="atualizarStatus('${nome}', this.value)" ${isDisabled}>
                            <option value="pendente" ${statusAtual === 'pendente' ? 'selected' : ''}>Pendente</option>
                            <option value="cursando" ${statusAtual === 'cursando' ? 'selected' : ''} ${!correqsOk && statusAtual === 'pendente' ? 'disabled' : ''}>Cursando</option>
                            <option value="concluida" ${statusAtual === 'concluida' ? 'selected' : ''} ${!correqsOk && statusAtual === 'pendente' ? 'disabled' : ''}>Concluída</option>
                        </select>
                    `;

                    // Avisos de bloqueio
                    let bloqueios = [];
                    const faltamPrereqs = info.prereqs.filter(req => statusMaterias[req] !== 'concluida');

                    if (faltamPrereqs.length > 0) {
                        bloqueios.push(`Falta Pré-req: ${faltamPrereqs.join(', ')}`);
                    }
                    if (info.req_ch && totalHoras < info.req_ch) {
                        bloqueios.push(`Falta CH: Exige ${info.req_ch}h`);
                    }
                    if (faltamCorreqs.length > 0 && statusAtual === 'pendente') {
                        bloqueios.push(`Falta Correquisito: ${faltamCorreqs.join(', ')} (exige estar Cursando ou Concluído)`);
                    }

                    if (bloqueios.length > 0 && statusAtual === 'pendente') {
                        html += `<div class="falta">${bloqueios.join('<br>')}</div>`;
                    }

                    // Notas extras
                    if (info.nota) {
                        html += `<div class="nota">ℹ️ ${info.nota}</div>`;
                    }

                    card.innerHTML = html;
                    lista.appendChild(card);
                });

                col.appendChild(lista);
                container.appendChild(col);
            }

            const novasListas = document.querySelectorAll('.disciplinas-lista');
            requestAnimationFrame(() => {
                novasListas.forEach((lista, index) => {
                    if (scrolls[index] !== undefined) {
                        lista.scrollTop = scrolls[index];
                    }
                });
            });
        }

        window.onload = function () {
            validarECorrigirGrade();
            renderizarGrade();
        };
    </script>
</body>

</html>
