<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Inteligente - Engenharia de Software (PUC Minas)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;

            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #4f46e5 100%);

            /* Status Colors (Light Palette) */
            --status-concluida-bg: #f0fdf4;
            --status-concluida-border: #10b981;
            --status-concluida-text: #065f46;

            --status-cursando-bg: #eff6ff;
            --status-cursando-border: #3b82f6;
            --status-cursando-text: #1e40af;

            --status-disponivel-bg: #fffbeb;
            --status-disponivel-border: #f59e0b;
            --status-disponivel-text: #92400e;

            --status-bloqueada-bg: #f8fafc;
            --status-bloqueada-border: #cbd5e1;
            --status-bloqueada-text: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%) fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .stats-bar>div {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            color: var(--text-muted);
        }

        .stats-bar span.highlight {
            color: #10b981;
            font-size: 1.05rem;
            font-weight: 700;
        }

        button.limpar {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            padding: 8px 18px;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        button.limpar:hover {
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .btn-importar {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            padding: 8px 18px;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-importar:hover { background: #2563eb; color: #fff; border-color: #2563eb; transform: translateY(-1px); }
        .btn-importar:disabled { opacity: 0.65; cursor: wait; transform: none; }
        .btn-exportar { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; padding: 8px 18px; border-radius: 9999px; cursor: pointer; font-weight: 600; font-size: 0.85rem; font-family: inherit; transition: all 0.2s ease; }
        .btn-exportar:hover { background: #7c3aed; color: #fff; border-color: #7c3aed; transform: translateY(-1px); }
        .importacao-status { width: 100%; min-height: 1.1rem; color: var(--text-muted); font-size: 0.78rem; text-align: center; }
        .importacao-status.erro { color: #dc2626; }
        .importacao-status.sucesso { color: #047857; }

        .grade-container {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 24px;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: stretch;
            scroll-behavior: smooth;
        }

        .grade-container::-webkit-scrollbar {
            height: 10px;
        }

        .grade-container::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 5px;
        }

        .grade-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 5px;
            border: 2px solid #f8fafc;
        }

        .grade-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .periodo {
            min-width: 320px;
            max-width: 320px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .periodo:hover {
            box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.08);
        }

        .periodo-header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .btn-concluir-periodo {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            padding: 0;
            margin: 0;
        }

        .btn-concluir-periodo:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .disciplinas-lista {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .disciplinas-lista::-webkit-scrollbar {
            width: 6px;
        }

        .disciplinas-lista::-webkit-scrollbar-track {
            background: transparent;
        }

        .disciplinas-lista::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .disciplinas-lista::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .disciplina {
            border: 1px solid transparent;
            border-left-width: 4px;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
            cursor: grab;
        }

        .disciplina:active {
            cursor: grabbing;
        }

        .disciplina.dragging {
            opacity: 0.5;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.1);
        }

        .disciplina:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.08);
        }

        .info-superior {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            font-weight: 600;
            font-size: 0.88rem;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .ch-info {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            margin-left: 8px;
        }

        .selecao-status {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 0.83rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .selecao-status:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .selecao-status:disabled {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            cursor: not-allowed;
            color: #94a3b8;
        }

        .nota,
        .falta {
            font-size: 0.78rem;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #e2e8f0;
            line-height: 1.4;
        }

        .falta {
            color: #dc2626;
            font-weight: 600;
        }

        .nota {
            color: #64748b;
            font-style: italic;
        }

        /* STATUS TEMAS (Light Mode Palette) */
        .status-concluida {
            background-color: var(--status-concluida-bg);
            border-color: #a7f3d0;
            border-left-color: var(--status-concluida-border);
            color: var(--status-concluida-text);
        }

        .status-concluida .ch-info {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #a7f3d0;
        }

        .status-cursando {
            background-color: var(--status-cursando-bg);
            border-color: #bfdbfe;
            border-left-color: var(--status-cursando-border);
            color: var(--status-cursando-text);
        }

        .status-cursando .ch-info {
            background: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #93c5fd;
        }

        .status-disponivel {
            background-color: var(--status-disponivel-bg);
            border-color: #fde68a;
            border-left-color: var(--status-disponivel-border);
            color: var(--status-disponivel-text);
        }

        .status-disponivel .ch-info {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fde047;
        }

        .status-bloqueada {
            background-color: var(--status-bloqueada-bg);
            border-color: #e2e8f0;
            border-left-color: var(--status-bloqueada-border);
            color: var(--status-bloqueada-text);
        }

        .status-bloqueada .ch-info {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎓 Grade Inteligente - Eng. de Software (PUC Minas)</h1>
        <div class="stats-bar">
            <div>Concluídas: <span class="highlight" id="contador">0</span>/<span id="total">0</span></div>
            <div>Cursando: <span class="highlight" style="color: #2563eb" id="cursando">0</span></div>
            <div>Carga Horária (Concluída): <span class="highlight" style="color: #4f46e5" id="horas">0</span>h</div>
            <button class="btn-importar" id="btn-importar" type="button" onclick="selecionarMatriz()">Importar matriz do SGA</button>
            <input id="arquivo-matriz" type="file" accept="application/pdf,.pdf" hidden onchange="importarMatriz(this.files[0])">
            <button class="btn-exportar" type="button" onclick="exportarGradeComoPng()">Exportar PNG</button>
            <button class="limpar" onclick="limparGrade()">Limpar Grade</button>
        </div>
        <div class="importacao-status" id="importacao-status" role="status" aria-live="polite"></div>
    </header>

    <div class="grade-container" id="grade-container">
        <!-- Renderizado pelo JavaScript -->
    </div>

    <script src="disciplinas.js"></script>

    <script>
        const STORAGE_KEY = 'pucEngSoftGrade';

        function carregarEstado() {
            try {
                const estado = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (estado && estado.versao === 1) return estado;
            } catch (erro) {
                console.warn('Não foi possível restaurar o progresso salvo.', erro);
            }
            return {
                versao: 1,
                statusMaterias: JSON.parse(localStorage.getItem('pucEngSoftStatus')) || {},
                ordemMaterias: JSON.parse(localStorage.getItem('pucEngSoftOrdem')) || {}
            };
        }

        const estadoInicial = carregarEstado();
        let statusMaterias = estadoInicial.statusMaterias || {};
        let ordemMaterias = estadoInicial.ordemMaterias || {};

        function persistirEstado() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ versao: 1, statusMaterias, ordemMaterias, atualizadoEm: new Date().toISOString() }));
            localStorage.setItem('pucEngSoftStatus', JSON.stringify(statusMaterias));
            localStorage.setItem('pucEngSoftOrdem', JSON.stringify(ordemMaterias));
        }

        function informarImportacao(mensagem, tipo = '') {
            const elemento = document.getElementById('importacao-status');
            elemento.textContent = mensagem;
            elemento.className = `importacao-status ${tipo}`;
        }

        function selecionarMatriz() {
            document.getElementById('arquivo-matriz').click();
        }

        function normalizarTexto(texto) {
            return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\([^)]*\)/g, ' ')
                .replace(/[^A-Z0-9]+/gi, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
        }

        async function extrairTextoPdf(arquivo) {
            const pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
            const pdf = await pdfjsLib.getDocument({ data: await arquivo.arrayBuffer() }).promise;
            const paginas = [];
            for (let numero = 1; numero <= pdf.numPages; numero++) {
                const pagina = await pdf.getPage(numero);
                const conteudo = await pagina.getTextContent();
                paginas.push(conteudo.items.map(item => item.str).join(' '));
            }
            return paginas.join('\n');
        }

        function localizarMarcador(texto, marcador, aPartirDe = 0) {
            // Alguns geradores de PDF separam até letras da mesma palavra em itens distintos.
            const padrao = marcador.replace(/\s/g, '').split('').join('\\s*');
            const correspondencia = new RegExp(padrao).exec(texto.slice(aPartirDe));
            return correspondencia ? aPartirDe + correspondencia.index : -1;
        }

        function intervalo(texto, inicio, fim) {
            const posicaoInicio = localizarMarcador(texto, inicio);
            if (posicaoInicio < 0) return '';
            const posicaoFim = localizarMarcador(texto, fim, posicaoInicio + inicio.length);
            return texto.slice(posicaoInicio, posicaoFim < 0 ? undefined : posicaoFim);
        }

        function secaoContemDisciplina(secao, nome) {
            const nomeNormalizado = normalizarTexto(nome);
            // Em nomes quebrados entre linhas, o SGA insere nota, CH, créditos e "Não"
            // antes da continuação. Removê-los recompõe o nome sem criar aproximações ambíguas.
            const secaoSemColunas = secao.replace(/CURSOU EQUIVALENTE/g, ' ')
                .replace(/\b(?:NAO|\d+)\b/g, ' ').replace(/\s+/g, ' ');
            if (secaoSemColunas.includes(nomeNormalizado)) return true;

            // Fallback para PDFs que omitem espaços entre palavras por diferença de fonte/renderização.
            const nomeCompacto = nomeNormalizado.replace(/\s/g, '');
            const secaoCompacta = secaoSemColunas.replace(/\s/g, '');
            return nomeCompacto.length >= 12 && secaoCompacta.includes(nomeCompacto);
        }

        function interpretarMatriz(textoOriginal) {
            const texto = normalizarTexto(textoOriginal);
            const cursadas = intervalo(texto, 'DISCIPLINAS DO CURRICULO', 'DISCIPLINAS EQUIVALENTES');
            const emCurso = intervalo(texto, 'DISCIPLINAS EM CURSO', 'DISCIPLINAS A CURSAR');
            if (!cursadas && !emCurso) {
                throw new Error('Não foi possível localizar as seções de disciplinas cursadas ou em curso no PDF.');
            }

            const resultado = {};
            const codigosCursadas = new Set(cursadas.match(/\b\d{5}\b/g) || []);
            const codigosEmCurso = new Set(emCurso.match(/\b\d{5}\b/g) || []);

            for (const [nome, info] of Object.entries(disciplinas)) {
                const codigos = [info.codigo, ...(info.codigosAlternativos || [])];
                if (codigos.some(codigo => codigosEmCurso.has(codigo)) || secaoContemDisciplina(emCurso, nome)) {
                    resultado[nome] = 'cursando';
                } else if (codigos.some(codigo => codigosCursadas.has(codigo)) || secaoContemDisciplina(cursadas, nome)) {
                    resultado[nome] = 'concluida';
                }
            }
            return resultado;
        }

        async function importarMatriz(arquivo) {
            const input = document.getElementById('arquivo-matriz');
            const botao = document.getElementById('btn-importar');
            if (!arquivo) return;
            if (!arquivo.name.toLowerCase().endsWith('.pdf')) {
                informarImportacao('Selecione um arquivo PDF.', 'erro');
                input.value = '';
                return;
            }

            botao.disabled = true;
            informarImportacao('Lendo a matriz curricular...');
            try {
                const resultado = interpretarMatriz(await extrairTextoPdf(arquivo));
                const total = Object.keys(resultado).length;
                const concluidas = Object.values(resultado).filter(s => s === 'concluida').length;
                const cursando = Object.values(resultado).filter(s => s === 'cursando').length;
                if (!total) throw new Error('Nenhuma disciplina da grade foi reconhecida no PDF.');
                if (!confirm(`Foram encontradas ${concluidas} disciplinas concluídas e ${cursando} em curso. Substituir o progresso atual?`)) {
                    informarImportacao('Importação cancelada. Seu progresso não foi alterado.');
                    return;
                }
                statusMaterias = resultado;
                persistirEstado();
                renderizarGrade();
                informarImportacao(`Matriz importada: ${concluidas} concluídas e ${cursando} em curso.`, 'sucesso');
            } catch (erro) {
                console.error(erro);
                informarImportacao(erro.message || 'Não foi possível importar o PDF.', 'erro');
            } finally {
                botao.disabled = false;
                input.value = '';
            }
        }

        function desenharRetanguloArredondado(ctx, x, y, largura, altura, raio) {
            ctx.beginPath();
            ctx.roundRect(x, y, largura, altura, raio);
            ctx.fill();
            if (ctx.lineWidth > 0) ctx.stroke();
        }

        function quebrarTexto(ctx, texto, larguraMaxima, maximoLinhas = 2) {
            const palavras = texto.split(' ');
            const linhas = [];
            let linha = '';
            for (const palavra of palavras) {
                const teste = linha ? `${linha} ${palavra}` : palavra;
                if (ctx.measureText(teste).width <= larguraMaxima) {
                    linha = teste;
                } else {
                    if (linha) linhas.push(linha);
                    linha = palavra;
                    if (linhas.length === maximoLinhas - 1) break;
                }
            }
            if (linha && linhas.length < maximoLinhas) linhas.push(linha);
            const consumido = linhas.join(' ').length;
            if (consumido < texto.length && linhas.length) {
                let ultima = linhas.length - 1;
                while (ctx.measureText(`${linhas[ultima]}…`).width > larguraMaxima) linhas[ultima] = linhas[ultima].slice(0, -1);
                linhas[ultima] += '…';
            }
            return linhas;
        }

        function exportarGradeComoPng() {
            const largura = 2400;
            const margem = 60;
            const topoGrade = 220;
            const espaco = 24;
            const colunas = 4;
            const larguraPeriodo = (largura - margem * 2 - espaco * (colunas - 1)) / colunas;
            const alturaPeriodo = 700;
            const altura = topoGrade + alturaPeriodo * 2 + espaco + margem;
            const canvas = document.createElement('canvas');
            canvas.width = largura;
            canvas.height = altura;
            const ctx = canvas.getContext('2d');

            const gradiente = ctx.createLinearGradient(0, 0, largura, altura);
            gradiente.addColorStop(0, '#f8fafc');
            gradiente.addColorStop(1, '#e2e8f0');
            ctx.fillStyle = gradiente;
            ctx.fillRect(0, 0, largura, altura);

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 48px Arial, sans-serif';
            ctx.fillText('Grade Inteligente · Engenharia de Software', margem, 78);
            ctx.fillStyle = '#64748b';
            ctx.font = '24px Arial, sans-serif';
            ctx.fillText('PUC Minas', margem, 116);

            const concluidas = Object.values(statusMaterias).filter(s => s === 'concluida').length;
            const cursando = Object.values(statusMaterias).filter(s => s === 'cursando').length;
            const horas = Object.entries(statusMaterias).reduce((total, [nome, status]) =>
                total + (status === 'concluida' && disciplinas[nome] ? disciplinas[nome].ch : 0), 0);
            ctx.font = 'bold 22px Arial, sans-serif';
            ctx.fillStyle = '#047857';
            ctx.fillText(`${concluidas} concluídas`, margem, 168);
            ctx.fillStyle = '#2563eb';
            ctx.fillText(`${cursando} cursando`, margem + 210, 168);
            ctx.fillStyle = '#6d28d9';
            ctx.fillText(`${horas}h concluídas`, margem + 400, 168);

            const temas = {
                concluida: { fundo: '#ecfdf5', borda: '#10b981', texto: '#065f46', rotulo: 'Concluída' },
                cursando: { fundo: '#eff6ff', borda: '#3b82f6', texto: '#1e40af', rotulo: 'Cursando' },
                pendente: { fundo: '#f8fafc', borda: '#cbd5e1', texto: '#475569', rotulo: 'Pendente' }
            };

            for (let periodo = 1; periodo <= 8; periodo++) {
                const coluna = (periodo - 1) % colunas;
                const linha = Math.floor((periodo - 1) / colunas);
                const x = margem + coluna * (larguraPeriodo + espaco);
                const y = topoGrade + linha * (alturaPeriodo + espaco);

                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 2;
                desenharRetanguloArredondado(ctx, x, y, larguraPeriodo, alturaPeriodo, 22);
                ctx.fillStyle = '#1e293b';
                ctx.lineWidth = 0;
                desenharRetanguloArredondado(ctx, x, y, larguraPeriodo, 66, 22);
                ctx.fillRect(x, y + 40, larguraPeriodo, 26);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px Arial, sans-serif';
                ctx.fillText(`${periodo}º Período`, x + 24, y + 43);

                const materias = Object.entries(disciplinas).filter(([, info]) => info.periodo === periodo);
                materias.forEach(([nome, info], indice) => {
                    const status = statusMaterias[nome] || 'pendente';
                    const tema = temas[status];
                    const cardX = x + 18;
                    const cardY = y + 82 + indice * 66;
                    const cardLargura = larguraPeriodo - 36;
                    ctx.fillStyle = tema.fundo;
                    ctx.strokeStyle = tema.borda;
                    ctx.lineWidth = 2;
                    desenharRetanguloArredondado(ctx, cardX, cardY, cardLargura, 54, 10);
                    ctx.fillStyle = tema.borda;
                    ctx.fillRect(cardX, cardY + 8, 5, 38);

                    ctx.fillStyle = tema.texto;
                    ctx.font = 'bold 15px Arial, sans-serif';
                    const linhasNome = quebrarTexto(ctx, nome, cardLargura - 150, 2);
                    linhasNome.forEach((texto, i) => ctx.fillText(texto, cardX + 18, cardY + 22 + i * 18));
                    ctx.textAlign = 'right';
                    ctx.font = 'bold 14px Arial, sans-serif';
                    ctx.fillText(`${tema.rotulo} · ${info.ch}h`, cardX + cardLargura - 14, cardY + 32);
                    ctx.textAlign = 'left';
                });
            }

            ctx.fillStyle = '#64748b';
            ctx.font = '18px Arial, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`Exportada em ${new Date().toLocaleDateString('pt-BR')}`, largura - margem, altura - 22);

            canvas.toBlob(blob => {
                if (!blob) return informarImportacao('Não foi possível gerar a imagem.', 'erro');
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `grade-engenharia-software-${new Date().toISOString().slice(0, 10)}.png`;
                link.click();
                URL.revokeObjectURL(url);
                informarImportacao('PNG exportado com sucesso.', 'sucesso');
            }, 'image/png');
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.disciplina:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function salvarNovaOrdem(periodo, lista) {
            const cards = [...lista.querySelectorAll('.disciplina')];
            const novaOrdem = cards.map(card => card.dataset.nome);
            ordemMaterias[periodo] = novaOrdem;
            persistirEstado();
        }

        function salvarProgresso() {
            validarECorrigirGrade();
            persistirEstado();
            renderizarGrade();
        }

        function validarECorrigirGrade() {
            let mudou = false;

            // Calcula CH atual concluída
            let totalHoras = 0;
            for (const [nome, status] of Object.entries(statusMaterias)) {
                if (status === 'concluida' && disciplinas[nome]) {
                    totalHoras += disciplinas[nome].ch;
                }
            }

            for (const [nome, status] of Object.entries(statusMaterias)) {
                const info = disciplinas[nome];
                if (!info) continue;

                const prereqsOk = info.prereqs.every(req => statusMaterias[req] === 'concluida');
                const horasOk = !info.req_ch || (totalHoras >= info.req_ch);
                const correqsOk = !info.correqs || info.correqs.every(req => statusMaterias[req] === 'cursando' || statusMaterias[req] === 'concluida');

                if (status === 'cursando' && (!prereqsOk || !horasOk || !correqsOk)) {
                    delete statusMaterias[nome];
                    mudou = true;
                }
            }

            if (mudou) {
                validarECorrigirGrade();
            }
        }

        function atualizarStatus(nome, novoStatus) {
            if (novoStatus === 'cursando' || novoStatus === 'concluida') {
                const info = disciplinas[nome];
                if (info && info.correqs && info.correqs.length > 0) {
                    const faltamCorreqs = info.correqs.filter(req =>
                        statusMaterias[req] !== 'cursando' && statusMaterias[req] !== 'concluida'
                    );
                    if (faltamCorreqs.length > 0) {
                        alert(`Para marcar "${nome}" como ${novoStatus === 'cursando' ? 'Cursando' : 'Concluída'}, a(s) matéria(s) correquisito(s) (${faltamCorreqs.join(', ')}) precisa(m) estar como "Cursando" ou "Concluída".`);
                        renderizarGrade();
                        return;
                    }
                }
            }

            if (novoStatus === 'pendente') {
                delete statusMaterias[nome];
            } else {
                statusMaterias[nome] = novoStatus;
            }
            salvarProgresso();
        }

        function limparGrade() {
            if (confirm("Tem certeza que deseja limpar todo o seu progresso?")) {
                statusMaterias = {};
                ordemMaterias = {};
                localStorage.removeItem('pucEngSoftOrdem');
                localStorage.removeItem(STORAGE_KEY);
                salvarProgresso();
            }
        }

        function concluirPeriodo(periodo) {
            if (!confirm(`Tem certeza que deseja marcar todo o ${periodo}º Período como concluído?`)) {
                return;
            }
            const materiasPeriodo = Object.entries(disciplinas).filter(([_, info]) => info.periodo === periodo);
            let mudou = false;

            materiasPeriodo.forEach(([nome, info]) => {
                if (statusMaterias[nome] !== 'concluida') {
                    statusMaterias[nome] = 'concluida';
                    mudou = true;
                }
            });

            if (mudou) {
                salvarProgresso();
                const concluidasAgora = materiasPeriodo.every(([nome, info]) => statusMaterias[nome] === 'concluida');
                if (!concluidasAgora) {
                    alert("Algumas matérias não puderam ser concluídas pois possuem pré-requisitos pendentes ou exigem mais carga horária.");
                }
            }
        }

        function renderizarGrade() {
            const listasAtuais = document.querySelectorAll('.disciplinas-lista');
            const scrolls = Array.from(listasAtuais).map(lista => lista.scrollTop);

            const container = document.getElementById('grade-container');
            container.innerHTML = '';

            let totalHoras = 0;
            let concluidasCount = 0;
            let cursandoCount = 0;

            // Calcula estatísticas
            for (const [nome, status] of Object.entries(statusMaterias)) {
                if (status === 'concluida') {
                    concluidasCount++;
                    if (disciplinas[nome] && disciplinas[nome].ch) {
                        totalHoras += disciplinas[nome].ch;
                    }
                } else if (status === 'cursando') {
                    cursandoCount++;
                }
            }

            document.getElementById('total').innerText = Object.keys(disciplinas).length;
            document.getElementById('contador').innerText = concluidasCount;
            document.getElementById('cursando').innerText = cursandoCount;
            document.getElementById('horas').innerText = totalHoras;

            let maxPeriodo = 8; // A grade da PUC tem 8 períodos

            for (let i = 1; i <= maxPeriodo; i++) {
                const col = document.createElement('div');
                col.className = 'periodo';

                const header = document.createElement('div');
                header.className = 'periodo-header';

                const titulo = document.createElement('span');
                titulo.innerText = `${i}º Período`;

                const btnConcluir = document.createElement('button');
                btnConcluir.className = 'btn-concluir-periodo';
                btnConcluir.innerHTML = '✓';
                btnConcluir.title = 'Concluir Período';
                btnConcluir.onclick = () => concluirPeriodo(i);

                header.appendChild(titulo);
                header.appendChild(btnConcluir);

                col.appendChild(header);

                const lista = document.createElement('div');
                lista.className = 'disciplinas-lista';

                lista.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const draggingCard = document.querySelector('.dragging');
                    if (!draggingCard || draggingCard.dataset.periodo != i) return;

                    const afterElement = getDragAfterElement(lista, e.clientY);
                    if (afterElement == null) {
                        lista.appendChild(draggingCard);
                    } else {
                        lista.insertBefore(draggingCard, afterElement);
                    }
                });

                lista.addEventListener('drop', (e) => {
                    e.preventDefault();
                    salvarNovaOrdem(i, lista);
                });

                const materiasPeriodo = Object.entries(disciplinas).filter(([_, info]) => info.periodo === i);

                materiasPeriodo.sort((a, b) => {
                    const orderA = (ordemMaterias[i] || []).indexOf(a[0]);
                    const orderB = (ordemMaterias[i] || []).indexOf(b[0]);

                    if (orderA !== -1 && orderB !== -1) return orderA - orderB;
                    if (orderA !== -1) return -1;
                    if (orderB !== -1) return 1;
                    return 0;
                });

                materiasPeriodo.forEach(([nome, info]) => {
                    const statusAtual = statusMaterias[nome] || 'pendente';

                    // Condição para pré-requisitos e Carga Horária
                    const prereqsOk = info.prereqs.every(req => statusMaterias[req] === 'concluida');
                    const horasOk = !info.req_ch || (totalHoras >= info.req_ch);

                    // Condição para correquisitos: precisam estar 'cursando' ou 'concluida'
                    const faltamCorreqs = (info.correqs || []).filter(req =>
                        statusMaterias[req] !== 'cursando' && statusMaterias[req] !== 'concluida'
                    );
                    const correqsOk = faltamCorreqs.length === 0;

                    const isAvailable = prereqsOk && horasOk;

                    // Define a classe CSS baseada no status atual e na disponibilidade
                    let classeCartao = 'status-bloqueada';
                    let icone = '🔒';

                    if (statusAtual === 'concluida') {
                        classeCartao = 'status-concluida';
                        icone = '✅';
                    } else if (statusAtual === 'cursando') {
                        classeCartao = 'status-cursando';
                        icone = '📘';
                    } else if (isAvailable && correqsOk) {
                        classeCartao = 'status-disponivel';
                        icone = '⏳';
                    }

                    const card = document.createElement('div');
                    card.className = `disciplina ${classeCartao}`;
                    card.draggable = true;
                    card.dataset.nome = nome;
                    card.dataset.periodo = i;

                    card.addEventListener('dragstart', (e) => {
                        card.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', nome);
                        e.dataTransfer.effectAllowed = 'move';
                    });

                    card.addEventListener('dragend', () => {
                        card.classList.remove('dragging');
                    });

                    // Clicar no card para alternar status
                    card.addEventListener('click', (e) => {
                        // Evita acionar ao clicar no select ou se o card estiver bloqueado
                        if (e.target.tagName.toLowerCase() === 'select') return;
                        if (!isAvailable && statusAtual === 'pendente') return;

                        let nextStatus = 'pendente';
                        if (statusAtual === 'pendente') nextStatus = 'cursando';
                        else if (statusAtual === 'cursando') nextStatus = 'concluida';
                        else if (statusAtual === 'concluida') nextStatus = 'pendente';

                        atualizarStatus(nome, nextStatus);
                    });

                    // Bloqueia a edição se não estiver disponível e não possuir um status ativo
                    const isDisabled = !isAvailable && statusAtual === 'pendente' ? 'disabled' : '';

                    let html = `
                        <div class="info-superior">
                            <span>${icone} ${nome}</span>
                            <span class="ch-info">${info.ch}h</span>
                        </div>
                        <select class="selecao-status" onchange="atualizarStatus('${nome}', this.value)" ${isDisabled}>
                            <option value="pendente" ${statusAtual === 'pendente' ? 'selected' : ''}>Pendente</option>
                            <option value="cursando" ${statusAtual === 'cursando' ? 'selected' : ''} ${!correqsOk && statusAtual === 'pendente' ? 'disabled' : ''}>Cursando</option>
                            <option value="concluida" ${statusAtual === 'concluida' ? 'selected' : ''} ${!correqsOk && statusAtual === 'pendente' ? 'disabled' : ''}>Concluída</option>
                        </select>
                    `;

                    // Avisos de bloqueio
                    let bloqueios = [];
                    const faltamPrereqs = info.prereqs.filter(req => statusMaterias[req] !== 'concluida');

                    if (faltamPrereqs.length > 0) {
                        bloqueios.push(`Falta Pré-req: ${faltamPrereqs.join(', ')}`);
                    }
                    if (info.req_ch && totalHoras < info.req_ch) {
                        bloqueios.push(`Falta CH: Exige ${info.req_ch}h`);
                    }
                    if (faltamCorreqs.length > 0 && statusAtual === 'pendente') {
                        bloqueios.push(`Falta Correquisito: ${faltamCorreqs.join(', ')} (exige estar Cursando ou Concluído)`);
                    }

                    if (bloqueios.length > 0 && statusAtual === 'pendente') {
                        html += `<div class="falta">${bloqueios.join('<br>')}</div>`;
                    }

                    // Notas extras
                    if (info.nota) {
                        html += `<div class="nota">ℹ️ ${info.nota}</div>`;
                    }

                    card.innerHTML = html;
                    lista.appendChild(card);
                });

                col.appendChild(lista);
                container.appendChild(col);
            }

            const novasListas = document.querySelectorAll('.disciplinas-lista');
            requestAnimationFrame(() => {
                novasListas.forEach((lista, index) => {
                    if (scrolls[index] !== undefined) {
                        lista.scrollTop = scrolls[index];
                    }
                });
            });
        }

        window.onload = function () {
            validarECorrigirGrade();
            persistirEstado();
            renderizarGrade();
        };
    </script>
</body>
